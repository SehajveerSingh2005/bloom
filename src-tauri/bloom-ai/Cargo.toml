[package]
name = "bloom-ai"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bloom's optional AI agent, run by Bloom on demand"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "process", "time", "io-util"] }

[package]
name = "bloom-ai"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bloom's optional AI agent, run by Bloom on demand"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy", "json", "form", "multipart"] }
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "process", "time", "io-util"] }
dirs = "6"
lettre = "0.11"
imap = "2.4"
native-tls = "0.2"
rustpotter = "3"
# rustpotter 3.0.x -> candle-core 0.2.2 breaks on half 2.5+ (rand_distr 0.5).
# Drop this when rustpotter moves off candle 0.2.
half = ">=2.4.1, <2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Media_Audio",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Variant",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

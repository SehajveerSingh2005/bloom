name: opencode

# Keep the existing /oc interface, but replace the unbounded github agent.
# Only trusted default-branch scripts execute; PR source is API-fetched data.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Pull request number
        required: true
      mode:
        description: Review scope
        type: choice
        options: [quick, deep]
        default: quick
      dry_run:
        description: Preview without posting a review comment
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  review:
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/oc review') || startsWith(github.event.comment.body, '/opencode review')) &&
        (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: ai-review-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned OpenCode CLI
        run: npm install --global @opencode/cli@2.0.26

      - name: Test automation
        run: node --test scripts/ai-model.test.mjs scripts/ai-review.test.mjs scripts/ai-triage.test.mjs

      - name: Review pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.1-flash-lite' }}
          AI_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          REVIEW_MODELS: ${{ vars.REVIEW_MODELS || vars.AI_MODELS || 'opencode/glm-5.3-flash-free,opencode/mimo-v2.6-flash-free,opencode/big-pickle' }}
          REVIEW_DEEP_MODELS: ${{ vars.REVIEW_DEEP_MODELS || vars.AI_MODELS || 'opencode/big-pickle,opencode/glm-5.3-flash-free,opencode/mimo-v2.6-flash-free' }}
        run: node scripts/ai-review.mjs

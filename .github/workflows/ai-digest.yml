name: AI triage digest

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned OpenCode CLI
        run: npm install --global @opencode/cli@2.0.26

      - name: Build digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS || vars.GEMINI_FALLBACK_MODEL || 'gemini-3.8-flash,gemini-3.5-flash,gemini-3.5-flash-lite' }}
          AI_MODELS: ${{ vars.TRIAGE_MODELS || vars.AI_MODELS || 'opencode/glm-5.3-flash-free,opencode/mimo-v2.6-flash-free,opencode/big-pickle' }}
        run: node scripts/ai-issues.mjs digest
